et * 86400000).toISOString().slice(0, 10);\n         return {\n            version: 2, seq: 10, base, selectedItem: \"camera\", selectedBooking: \"booking-1\", selectedRequest: \"request-1\",\n            selectedCase: \"case-1\", conversation: \"neighbors\", dates: { start: date(2), end: date(4) },\n            favorites: [\"camera\"], profile: { name: \"Alex Morgan\", area: \"Dallas\" },\n            fees: [{ total: 10, renterShare: 50, effective: 0, reason: \"Standard service fee\" }],\n            policy: { threshold: 1000, maximum: 5000 },\n           listings: [\n              { id: \"camera\", name: \"Sony A7 IV camera kit\", category: \"Camera\", area: \"Irving\", price: 85, value: 2400, status: \"published\", instant: false, description: \"Two lenses, a charged battery and a carry case. A good companion for a weekend story.\", blocked: [{ start: date(5), end: date(7) }], photo: 0 },\n              { id: \"drill\", name: \"Cordless drill kit\", category: \"Tools\", area: \"Dallas\", price: 25, value: 240, status: \"published\", instant: true, description: \"Cordless drill, spare battery and a set of bits for the little jobs around home.\", blocked: [], photo: 1 },\n              { id: \"projector\", name: \"Portable projector\", category: \"Electronics\", area: \"Dallas\", price: 60, value: 650, status: \"published\", instant: true, description: \"Bring movie night outside. Includes the power cable and a compact tabletop stand.\", blocked: [], photo: 2 }\n            ],\n          bookings: [{ id: \"booking-1\", listingId: \"camera\", name: \"Sony A7 IV camera kit\", start: date(8), end: date(10), status: \"requested\", days: 2, price: 85, subtotal: 170, renterFee: 8.5, ownerFee: 8.5, total: 178.5, ownerNet: 161.5, feeRule: { total: 10, renterShare: 50 }, source: \"seed\", refund: 0 }],\n           requests: [{ id: \"request-1\", title: \"Projector for a neighborhood talk\", category: \"Electronics\", area: \"Dallas\", start: date(2), end: date(4), budget: 75, quantity: 1, description: \"A compact projector for a short community presentation.\", status: \"open\", mine: true, openForOffers: false, linked: [] }],\n          bids: [{ id: \"bid-1\", listingId: \"drill\", start: date(12), end: date(14), amount: 30, status: \"eligible\", mine: false }, { id: \"bid-2\", listingId: \"drill\", start: date(14), end: date(16), amount: 31, status: \"eligible\", mine: false }],\n            auctionClose: now + 7 * 86400000,\n            messages: [{ id: \"message-1\", conversation: \"neighbors\", from: \"owner\", text: \"Hi Alex! The camera kit includes both lenses and a carry case. Happy to answer any questions.\" }],\n            notifications: [{ id: \"notice-1\", text: \"A camera request is waiting for your decision.\", read: false }],\n           cases: [{ id: \"case-1\", kind: \"support\", title: \"Pickup coordination\", status: \"open\", replies: [] }],\n            records: { users: [{ id: \"user-1\", name: \"Jordan Bennett\", status: \"active\" }], investigations: [{ id: \"investigation-1\", name: \"Account review\", status: \"open\" }], reviews: [{ id: \"review-1\", name: \"Helpful neighbor, clear handoff.\", status: \"visible\" }], promotions: [{ id: \"promotion-1\", name: \"Neighborhood welcome\", status: \"active\" }], categories: [{ id: \"category-1\", name: \"Tools\", status: \"visible\" }, { id: \"category-2\", name: \"Camera\", status: \"visible\" }, { id: \"category-3\", name: \"Electronics\", status: \"visible\" }] },\n            audit: []\n          };\n        }\n        function create(storage, clock = () => Date.now()) {\n          let data, error = \"\";\n          try {\n            const raw = storage.getItem(key);\n            data = raw ? JSON.parse(raw) : seed(clock());\n            if (data.version !== 2 || ![\"listings\", \"bookings\", \"fees\", \"requests\", \"bids\", \"messages\", \"favorites\", \"notifications\", \"cases\", \"audit\"].every(key => Array.isArray(data[key])) || !data.policy || !data.records || !data.profile || !data.dates || !Number.isInteger(data.seq) || !data.fees.length) throw new Error(\"Saved workspace data is not compatible.\");\n          } catch (cause) {\n            error = `Your saved workspace could not be loaded: ${cause.message}. Please contact support if the issue persists.`;\n            data = seed(clock());\n          }\n          const require = (condition, message) => { if (!condition) throw new Error(message); };\n          const id = (draft, prefix) => `${prefix}-${++draft.seq}`;\n          function commit(action, callback) {\n            require(!error, error);\n            const draft = copy(data);\n            const result = callback(draft);\n            draft.audit.push({ action, at: clock() });\n            try { storage.setItem(key, JSON.stringify(draft)); }\n            catch (cause) { throw new Error(`Your change was not saved: ${cause.message}. Check your browser storage settings and retry.`); }\n            data = draft;\n           return copy(result === undefined ? null : result);\n          }\n          function dates(start, end) {\n            require(day(start) && day(end) && end > start, \"Choose valid dates with return after pickup.\");\n            require(start >= new Date(clock()).toISOString().slice(0, 10), \"Choose pickup today or later.\");\n           return Math.round((Date.parse(end) - Date.parse(start)) / 86400000);\n          }\n          function available(listingId, start, end, source = data, ignoreBid = \"\") {\n           dates(start, end);\n            const listing = source.listings.find(item => item.id === listingId);\n            require(listing && listing.status === \"published\", \"This listing is not published.\");\n           return !listing.blocked.some(range => overlap(start, end, range.start, range.end))\n              && !source.bookings.some(booking => booking.listingId === listingId && booking.bidId !== ignoreBid && [\"requested\", \"confirmed\", \"active\"].includes(booking.status) && overlap(start, end, booking.start, booking.end));\n          }\n          function quote(listingId, start, end, source = data, rate) {\n            const days = dates(start, end);\n            const listing = source.listings.find(item => item.id === listingId);\n            require(listing, \" listing not found.\");\n            const feeRule = [...source.fees].reverse().filter(rule => rule.effective \u003c= clock()).sort((a, b) => b.effective - a.effective)[0];\n            const subtotal = money(days * (rate ?? listing.price));\n            const allFees = money(subtotal * feeRule.total / 100);\n            const renterFee = money(allFees * feeRule.renterShare / 100);\n            const ownerFee = money(allFees - renterFee);\n           return { days, price: rate ?? listing.price, subtotal, renterFee, ownerFee, total: money(subtotal + renterFee), ownerNet: money(subtotal - ownerFee), feeRule: copy(feeRule) };\n          }\n          function addBooking(draft, listingId, start, end, status, rate, bidId) {\n            require(available(listingId, start, end, draft), \"Those dates are unavailable in the calendar. Choose another period.\");\n            const listing = draft.listings.find(item => item.id === listingId);\n            const booking = { id: id(draft, \"booking\"), listingId, name: listing.name, start, end, status, ...quote(listingId, start, end, draft, rate), source: bidId ? \"auction\" : \"demo\", bidId: bidId || null, refund: 0 };\n            draft.bookings.push(booking);\n            draft.selectedBooking = booking.id;\n            draft.notifications.push({ id: id(draft, \"notice\"), text: `Booking ${booking.id}: ${status}.`, read: false });\n           return booking;\n          }\n         return {\n            get data() { return copy(data); },\n            get error() { return error; },\n            date(offset) { return new Date(Date.parse(`${data.base}T00:00:00Z`) + offset * 86400000).toISOString().slice(0, 10); },\n            reset() {\n              const next = seed(clock());\n              try { storage.setItem(key, JSON.stringify(next)); }\n              catch (cause) { throw new Error(`Reset was not saved: ${cause.message}.`); }\n              data = next; error = \"\";\n            },\n            select(field, value) { require([\"selectedItem\", \"selectedBooking\", \"selectedRequest\", \"selectedCase\", \"conversation\"].includes(field), \"This selection is unavailable.\"); return commit(\"select\", draft => { draft[field] = value; }); },\n            setDates(start, end) { dates(start, end); return commit(\"dates\", draft => { draft.dates = { start, end }; }); },\n            available, quote,\n            book(listingId, start, end) { return commit(\"booking-created\", draft => addBooking(draft, listingId, start, end, draft.listings.find(item => item.id === listingId)?.instant ? \"confirmed\" : \"requested\")); },\n            transition(bookingId, next) {\n             return commit(`booking-${next}`, draft => {\n                const booking = draft.bookings.find(item => item.id === bookingId);\n                require(booking, \" booking not found.\");\n                const allowed = { requested: [\"confirmed\", \"declined\", \"cancelled\"], confirmed: [\"active\", \"cancelled\"], active: [\"completed\"] };\n                require(allowed[booking.status]?.includes(next), `Cannot change ${booking.status} booking to ${next}.`);\n               booking.status = next;\n                if (next === \"cancelled\" || next === \"declined\") booking.refund = booking.total;\n                draft.notifications.push({ id: id(draft, \"notice\"), text: `${booking.id} is now ${next}.`, read: false });\n               return booking;\n              });\n            },\n            favorite(listingId) { return commit(\"favorite\", draft => { require(draft.listings.some(item => item.id === listingId), \" item not found.\"); const index = draft.favorites.indexOf(listingId); if (index \u003c 0) draft.favorites.push(listingId); else draft.favorites.splice(index, 1); }); },\n            markRead(noticeId) { return commit(\"notice-read\", draft => { const notice = draft.notifications.find(item => item.id === noticeId); require(notice, \"Notification not found.\"); notice.read = true; }); },\n            saveListing(fields, listingId) {\n             return commit(\"listing-saved\", draft => {\n                const price = Number(fields.price), value = Number(fields.value);\n                let photos;\n                try { photos = JSON.parse(fields.photos || \"[]\"); } catch { throw new Error(\"Review the selected listing photos and try again.\"); }\n                require(fields.name?.trim().length >= 3 && fields.description?.trim().length >= 10 && fields.area?.trim().length >= 2 && fields.category, \"Complete the listing title, description, category and approximate area.\");\n                require(Array.isArray(photos) && photos.length > 0 && photos.length \u003c= 4 && photos.every(photo => typeof photo === \"string\" && photo.length \u003c 1900000), \"Choose one to four valid listing photos.\");\n                require(Number.isFinite(price) && price >= 1 && price \u003c= 5000, \"Daily price must be between $1 and $5,000.\");\n                require(Number.isFinite(value) && value >= 0 && value \u003c= draft.policy.maximum, `Estimated value must be between $0 and $${draft.policy.maximum}.`);\n                let listing = listingId ? draft.listings.find(item => item.id === listingId) : null;\n                require(!listingId || listing, \" listing not found.\");\n                if (!listing) { listing = { id: id(draft, \"listing\"), blocked: [], photo: 1 }; draft.listings.push(listing); }\n                Object.assign(listing, { name: fields.name.trim().slice(0, 120), description: fields.description.trim().slice(0, 2000), category: fields.category, area: fields.area.trim().slice(0, 200), price, value, photos, instant: !!fields.instant, status: value > draft.policy.threshold ? \"review\" : \"published\" });\n                draft.selectedItem = listing.id;\n               return listing;\n              });\n            },\n            blockDates(listingId, start, end) { return commit(\"availability-blocked\", draft => { require(available(listingId, start, end, draft), \"Cannot block dates occupied by a booking or another block.\"); draft.listings.find(item => item.id === listingId).blocked.push({ start, end }); }); },\n            unblock(listingId, index) { return commit(\"availability-opened\", draft => { const listing = draft.listings.find(item => item.id === listingId); require(listing && listing.blocked[index], \"Blocked period not found.\"); listing.blocked.splice(index, 1); }); },\n            moderateListing(listingId, next) { return commit(\"listing-moderated\", draft => { const listing = draft.listings.find(item => item.id === listingId); require(listing && [\"published\", \"paused\", \"rejected\"].includes(next), \"Invalid listing decision.\"); require(next !== \"published\" || listing.value \u003c= draft.policy.maximum, \"Listing exceeds current maximum value.\"); listing.status = next; }); },\n            matches(request) { dates(request.start, request.end); return data.listings.filter(item => item.status === \"published\" && item.category === request.category && (!request.area || item.area.toLowerCase().includes(request.area.toLowerCase())) && (!request.budget || item.price \u003c= Number(request.budget)) && Number(request.quantity || 1) === 1 && available(item.id, request.start, request.end)); },\n           request(fields) { return commit(\"request-created\", draft => {\n             dates(fields.start, fields.end);\n              require(fields.title?.trim().length >= 3 && fields.description?.trim().length >= 10 && fields.area?.trim().length >= 2 && fields.category, \"Complete the request title, category, description and area.\");\n              require(Number.isInteger(Number(fields.quantity)) && Number(fields.quantity) >= 1 && Number(fields.quantity) \u003c= 100, \"Quantity must be 1 to 100.\");\n              require(!fields.budget || (Number.isFinite(Number(fields.budget)) && Number(fields.budget) > 0), \"Budget must be positive.\");\n              require(fields.reviewed, \"Review matching listings before posting.\");\n              const request = { ...fields, id: id(draft, \"request\"), title: fields.title.trim().slice(0, 120), status: \"open\", mine: true, openForOffers: false, linked: [] };\n              draft.requests.push(request); draft.selectedRequest = request.id; return request;\n            }); },\n            closeRequest(requestId) { return commit(\"request-closed\", draft => { const request = draft.requests.find(item => item.id === requestId); require(request && request.status === \"open\", \"Request is not open.\"); request.status = \"closed\"; }); },\n            linkRequest(requestId, listingId) { return commit(\"request-linked\", draft => { const request = draft.requests.find(item => item.id === requestId); require(request && request.status === \"open\", \"Request is closed.\"); require(this.matches(request).some(item => item.id === listingId), \"Listing does not match the request.\"); require(!request.linked.includes(listingId), \"Listing is already linked.\"); request.linked.push(listingId); }); },\n            send(conversation, text, from = \"you\") { return commit(\"message-added\", draft => { require(text.trim().length > 0 && text.length \u003c= 500, \"Write a message of 1 to 500 characters.\"); draft.messages.push({ id: id(draft, \"message\"), conversation, from, text: text.trim() }); }); },\n           bid(start, end, amount) { return commit(\"bid-created\", draft => {\n              require(clock() \u003c draft.auctionClose, \"This  auction has closed.\");\n              require(available(\"drill\", start, end, draft), \"Bid dates are unavailable.\");\n              const min = Math.max(25, ...draft.bids.map(item => item.amount)) + 1;\n              require(Number.isFinite(Number(amount)) && Number(amount) >= min && Number(amount) \u003c= 5000, `Bid at least $${min} per day, up to $5,000.`);\n              const bid = { id: id(draft, \"bid\"), listingId: \"drill\", start, end, amount: Number(amount), mine: true, status: \"eligible\" };\n              draft.bids.push(bid); return bid;\n            }); },\n            award(bidId) { return commit(\"owner-selected-bid\", draft => {\n              require(clock() \u003c draft.auctionClose, \"The selection deadline has passed.\");\n              const bid = draft.bids.find(item => item.id === bidId);\n              require(bid && bid.status === \"eligible\", \"Bid is not eligible for selection.\");\n              require(!draft.bids.some(item => item.status === \"selected\" && overlap(bid.start, bid.end, item.start, item.end)), \"Those dates overlap an owner-selected bid.\");\n              const booking = addBooking(draft, bid.listingId, bid.start, bid.end, \"confirmed\", bid.amount, bid.id);\n             bid.status = \"selected\"; bid.bookingId = booking.id; return booking;\n            }); },\n            fees(total, renterShare, effective, reason) { return commit(\"fee-rule-saved\", draft => {\n              require(Number.isFinite(total) && total >= 0 && total \u003c= 100 && Number.isFinite(renterShare) && renterShare >= 0 && renterShare \u003c= 100, \"Fee and renter share must be 0% to 100%.\");\n              require(reason.trim().length > 0, \"Give a reason for the change.\");\n              require(Number.isFinite(effective) && (effective === 0 || effective > clock()), \"Choose now or a future effective time.\");\n              draft.fees.push({ total, renterShare, effective: effective || clock(), reason: reason.trim().slice(0, 500) });\n            }); },\n            policy(threshold, maximum, reason) { return commit(\"policy-saved\", draft => { require(Number.isFinite(threshold) && Number.isFinite(maximum) && threshold >= 0 && maximum > 0 && threshold \u003c= maximum, \"Review threshold must be nonnegative and no greater than the positive maximum.\"); require(reason.trim(), \"Give a reason for the change.\"); draft.policy = { threshold, maximum }; }); },\n           profile(name, area) { return commit(\"profile-saved\", draft => { require(name.trim() && area.trim(), \"Enter a display name and approximate area.\"); draft.profile = { name: name.trim().slice(0, 80), area: area.trim().slice(0, 100) }; }); },\n            newCase(kind, title) { return commit(\"case-created\", draft => { require([\"claim\", \"support\"].includes(kind) && title.trim().length >= 3, \"Enter a topic of at least three characters.\"); const record = { id: id(draft, \"case\"), kind, title: title.trim().slice(0, 120), status: \"open\", replies: [] }; draft.cases.push(record); draft.selectedCase = record.id; return record; }); },\n            reply(caseId, text, internal = false) { return commit(\"case-reply\", draft => { const record = draft.cases.find(item => item.id === caseId); require(record && text.trim() && text.length \u003c= 500, \"Choose a case and write a note of 1 to 500 characters.\"); record.replies.push({ text: text.trim(), internal }); }); },\n            resolve(caseId) { return commit(\"case-resolved\", draft => { const record = draft.cases.find(item => item.id === caseId); require(record, \"Case not found.\"); record.status = \"resolved\"; }); },\n            record(kind, recordId, status) { return commit(\"admin-record-updated\", draft => { const record = draft.records[kind]?.find(item => item.id === recordId); const allowed = { users: [\"active\", \"restricted\"], investigations: [\"open\", \"reviewed\"], reviews: [\"visible\", \"hidden\"], promotions: [\"active\", \"paused\"], categories: [\"visible\", \"hidden\"] }; require(record && allowed[kind]?.includes(status), \"Invalid  record action.\"); record.status = status; }); },\n            addRecord(kind, name) { return commit(\"admin-record-created\", draft => { require([\"promotions\", \"categories\"].includes(kind) && name.trim(), \"Enter a name for the  category or promotion.\"); draft.records[kind].push({ id: id(draft, kind), name: name.trim().slice(0, 100), status: kind === \"categories\" ? \"visible\" : \"active\" }); }); }\n          };\n        }\n       return { create, key };\n      })();\n    \u003c/script>\n    \u003cscript defer>\n      document.addEventListener(\"DOMContentLoaded\", () => {\n        const routes = [\n          { id: \"home\", group: \"market\", label: \"Discover\", path: \"/\", title: \"Good things, close to home.\", summary: \"Find something useful nearby, or share what you already own.\", view: \"home\" },\n          { id: \"search\", group: \"market\", label: \"Browse items\", path: \"/search\", title: \"Find your next useful thing.\", summary: \"Choose your dates and explore what's available around the corner.\", view: \"search\" },\n          { id: \"listing\", group: \"market\", label: \"Item details\", path: \"/listing/:id\", title: \"A little more about this item.\", summary: \"Everything you need to plan a thoughtful handoff.\", view: \"listing\" },\n          { id: \"bidding\", group: \"market\", label: \"Bidding\", path: \"/bidding\", title: \"Find a good opportunity.\", summary: \"Choose your dates and place a bid. The owner selects the right fit before bidding closes.\", view: \"bidding\" },\n          { id: \"my-bids\", group: \"market\", label: \"My bids\", path: \"/bidding?view=my-bids\", title: \"Your bids.\", summary: \"Follow your offers and the owner's decisions.\", view: \"bidding\" },\n          { id: \"bid-detail\", group: \"market\", label: \"Bid detail\", path: \"/bidding/:id\", title: \"Make an offer for your dates.\", summary: \"Check the rental period and your daily bid before sending.\", view: \"bidding\" },\n          { id: \"auction\", group: \"market\", label: \"Owner auction\", path: \"/auction/:id\", title: \"Choose the right rental.\", iew: \"claims\" },\n          { id: \"claim-detail\", group: \"community\", label: \"Claim detail\", path: \"/claims/:id\", title: \"Your rental claim.\", summary: \"Follow the conversation and the next steps.\", view: \"claim-detail\" },\n          { id: \"support\", group: \"community\", label: \"Support\", path: \"/support\", title: \"How can we help?\", summary: \"Start a conversation with the support team or review an open case.\", view: \"support\" },\n          { id: \"support-detail\", group: \"community\", label: \"Support ticket\", path: \"/support/:id\", title: \"Your support request.\", summary: \"Keep the details and replies together.\", view: \"support-detail\" },\n          { id: \"admin-access\", group: \"admin\", label: \"Team workspace\", path: \"/admin\", title: \"Team workspace.\", summary: \"Choose where you want to work.\", view: \"admin-access\" },\n          { id: \"admin-overview\", group: \"admin\", label: \"Action Center\", path: \"/admin/overview\", title: \"Action Center.\", summary: \"The latest marketplace activity and records needing attention.\", view: \"admin-overview\" },\n          { id: \"admin-listings\", group: \"admin\", label: \"Listings\", path: \"/admin/listings\", title: \"Listing review.\", summary: \"Review publication requests and manage listing status.\", view: \"admin-queue\" },\n          { id: \"admin-requests\", group: \"admin\", label: \"Item requests\", path: \"/admin/requests\", title: \"Community requests.\", summary: \"Review active requests and keep the marketplace useful.\", view: \"admin-queue\" },\n          { id: \"admin-bookings\", group: \"admin\", label: \"Bookings\", path: \"/admin/bookings\", title: \"Booking operations.\", summary: \"Review rental details, owner decisions and handoff progress.\", view: \"admin-queue\" },\n          { id: \"admin-users\", group: \"admin\", label: \"Users\", path: \"/admin/users\", title: \"Customer accounts.\", summary: \"Review account status and access.\", view: \"admin-queue\" },\n          { id: \"admin-investigations\", group: \"admin\", label: \"Investigations\", path: \"/admin/investigations\", title: \"Account reviews.\", summary: \"Track the records that need a closer look.\", view: \"admin-queue\" },\n          { id: \"admin-disputes\", group: \"admin\", label: \"Disputes & claims\", path: \"/admin/disputes\", title: \"Disputes and claims.\", summary: \"Review case history, add notes and resolve open questions.\", view: \"admin-queue\" },\n          { id: \"admin-support\", group: \"admin\", label: \"Support tickets\", path: \"/admin/support\", title: \"Customer support.\", summary: \"Respond to questions and keep conversations moving.\", view: \"admin-queue\" },\n          { id: \"admin-reviews\", group: \"admin\", label: \"Reviews\", path: \"/admin/reviews\", title: \"Review moderation.\", summary: \"Manage review visibility and marketplace quality.\", view: \"admin-queue\" },\n          { id: \"admin-payments\", group: \"admin\", label: \"Payments\", path: \"/admin/payments\", title: \"Rental amounts.\", summary: \"Review booking totals and open the full rental history.\", view: \"admin-queue\" },\n          { id: \"admin-payouts\", group: \"admin\", label: \"Payouts\", path: \"/admin/payouts\", title: \"Owner earnings.\", summary: \"Review amounts from completed rentals.\", view: \"admin-queue\" },\n          { id: \"admin-refunds\", group: \"admin\", label: \"Refund requests\", path: \"/admin/refunds\", title: \"Cancellation credits.\", summary: \"Review adjustments associated with cancelled or declined requests.\", view: \"admin-queue\" },\n          { id: \"admin-promotions\", group: \"admin\", label: \"Promotions & rewards\", path: \"/admin/promotions\", title: \"Promotions.\", summary: \"Manage campaign names and active status.\", view: \"admin-queue\" },\n          { id: \"admin-categories\", group: \"admin\", label: \"Categories\", path: \"/admin/categories\", title: \"Categories.\", summary: \"Manage the category catalog and visibility.\", view: \"admin-queue\" },\n          { id: \"admin-settings\", group: \"admin\", label: \"Global settings\", path: \"/admin/settings\", title: \"Marketplace settings.\", summary: \"Manage fees, their allocation and listing value limits.\", view: \"admin-settings\" },\n          { id: \"admin-insurance\", group: \"admin\", label: \"Insurance & protection\", path: \"/admin/insurance\", title: \"Insurance and protection.\", summary: \"This service is currently unavailable.\", view: \"admin-unavailable\" },\n          { id: \"admin-analytics\", group: \"admin\", label: \"Analytics & exports\", path: \"/admin/analytics\", title: \"Marketplace activity.\", summary: \"Follow listings, bookings and completed earnings.\", view: \"admin-analytics\" }\n        ];\n        const routeById = new Map(routes.map(route => [route.id, route]));\n        const routeNav = document.querySelector(\"[data-route-nav]\");\n        const areaNav = document.querySelector(\"[data-area-nav]\");\n        const accountMenu = document.querySelector(\"[data-account-menu]\");\n        const accountLinks = document.querySelector(\"[data-account-links]\");\n        const page = document.querySelector(\"[data-page]\");\n        const roleNotice = document.querySelector(\"[data-role-notice]\");\n        const state = { adminRole: null };\n        const demo = window.YBuyMock.create({\n          getItem: key => window.localStorage.getItem(key),\n          setItem: (key, value) => window.localStorage.setItem(key, value)\n        });\n        const ui = { screen: \"home\", message: \"\", filter: \"all\", query: \"\", category: \"all\", area: \"\", sort: \"name\", failNext: false, reviewed: \"\" };\n        const products = [\n          { name: \"Sony A7 IV camera kit\", category: \"Camera\", area: \"Irving\", price: 85, img: \"https://images.pexels.com/photos/19969452/pexels-photo-19969452.jpeg?auto=compress&cs=tinysrgb&w=760&h=560&fit=crop\", alt: \"camera for a listing\" },\n          { name: \"Cordless drill kit\", category: \"Tools\", area: \"Dallas\", price: 25, img: \"https://images.pexels.com/photos/30413428/pexels-photo-30413428.jpeg?auto=compress&cs=tinysrgb&w=760&h=560&fit=crop\", alt: \"power tool for a listing\" },\n          { name: \"Portable projector\", category: \"Electronics\", area: \"Dallas\", price: 60, img: \"https://images.pexels.com/photos/5515482/pexels-photo-5515482.jpeg?auto=compress&cs=tinysrgb&w=760&h=560&fit=crop\", alt: \"projector for a listing\" }\n        ];\n        const adminLabels = {\n          \"admin-listings\": \"Listings\",\n          \"admin-requests\": \"Item requests\",\n          \"admin-bookings\": \"Bookings\",\n          \"admin-users\": \"Users\",\n          \"admin-investigations\": \"Customer investigations\",\n          \"admin-disputes\": \"Disputes & claims\",\n          \"admin-support\": \"Support tickets\",\n          \"admin-reviews\": \"Reviews\",\n          \"admin-payments\": \"Payments\",\n          \"admin-payouts\": \"Payouts\",\n          \"admin-refunds\": \"Refund requests\",\n          \"admin-promotions\": \"Promotions & rewards\",\n          \"admin-categories\": \"Categories\"\n        };\n\n        function routeLink(route) {\n         return `\u003ca class=\"route-link\" href=\"?screen=${route.id}\" data-screen-link=\"${route.id}\">\u003cspan class=\"route-link-name\">${route.label}\u003c/span>\u003cspan class=\"route-link-arrow\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>`;\n        }\n\n        function renderNavigation(route) {\n          const biddingActive = route.path.startsWith(\"/bidding\") || route.path.startsWith(\"/auction\");\n          const primaryLinks = [\n            { id: \"home\", label: \"Explore\", active: route.id === \"home\" },\n            { id: \"search\", label: \"Browse items\", active: route.group === \"market\" && route.id !== \"home\" && !biddingActive && ![\"guidelines\", \"access\"].includes(route.id) },\n            { id: \"renting\", label: \"My rentals\", active: route.group === \"rent\" },\n            { id: \"lending\", label: \"Lend\", active: route.group === \"lend\" },\n            { id: \"requests\", label: \"Community\", active: route.group === \"community\" },\n            { id: \"bidding\", label: \"Bidding\", active: biddingActive }\n          ];\n          areaNav.innerHTML = primaryLinks.map(item => `\u003ca href=\"?screen=${item.id}\" data-screen-link=\"${item.id}\" ${item.active ? 'aria-current=\"page\"' : \"\"}>${item.label}\u003c/a>`).join(\"\");\n          const accountGroups = [\n            { label: \"Your account\", ids: [\"access\", \"profile\", \"favorites\", \"notifications\", \"wallet\"] },\n            { label: \"Community & help\", ids: [\"my-requests\", \"need-something\", \"messages\", \"claims\", \"support\", \"guidelines\"] },\n            { label: \"Administration\", ids: [\"admin-access\"] }\n          ];\n          accountLinks.innerHTML = accountGroups.map(group => `\u003cdiv class=\"account-link-group\">\u003cspan class=\"account-link-heading\">${group.label}\u003c/span>${group.ids.map(id => routeById.get(id)).map(item => `\u003ca href=\"?screen=${item.id}\" data-screen-link=\"${item.id}\" ${item.id === route.id ? 'aria-current=\"page\"' : \"\"}>${item.label}\u003c/a>`).join(\"\")}\u003c/div>`).join(\"\");\n          accountMenu.setAttribute(\"data-current\", route.group === \"admin\" || accountGroups.some(group => group.ids.includes(route.id)) ? \"true\" : \"false\");\n          const workspaceRoutes = route.group === \"lend\"\n            ? [\"lending\", \"owner-listings\", \"create-listing\", \"payouts\"].map(id => routeById.get(id))\n            : route.group === \"admin\" && route.id !== \"admin-access\" && state.adminRole\n              ? routes.filter(item => item.group === \"admin\" && item.id !== \"admin-access\")\n              : [];\n          routeNav.hidden = workspaceRoutes.length === 0;\n          if (workspaceRoutes.length) {\n            const label = route.group === \"admin\" ? \"Administration workspace\" : \"Lending workspace\";\n            routeNav.setAttribute(\"aria-label\", label);\n            routeNav.innerHTML = `\u003cspan class=\"workspace-label\">${label}\u003c/span>${workspaceRoutes.map(item => `\u003ca href=\"?screen=${item.id}\" data-screen-link=\"${item.id}\" ${item.id === route.id ? 'aria-current=\"page\"' : \"\"}>${item.label}\u003c/a>`).join(\"\")}`;\n          } else {\n            routeNav.innerHTML = \"\";\n          }\n        }\n\n        function frame(route, body, className = \"\") {\n          const heading = route.id === \"home\" ? \"\" : `\u003cheader class=\"view-head\">\u003cdiv class=\"view-head-main\">\u003ch1 tabindex=\"-1\">${route.title}\u003c/h1>\u003cp>${route.summary}\u003c/p>\u003c/div>\u003c/header>`;\n         return `\u003csection class=\"view ${className}\">${heading}\u003cdiv class=\"view-body\">${body}\u003c/div>\u003c/section>`;\n        }\n\n        function searchForm() {\n         return `\u003cform class=\"search-tools\" data-form=\"search\" role=\"search\" aria-label=\"Filter inventory\">\n            ${field(\"What are you looking for?\", \"query\", ui.query, \"text\", 'data-market-query placeholder=\"Camera, tools, projector\"')}\n            \u003cdiv class=\"field\">Category${selectControl(\"category\", \"Category\", ui.category, [{ label: \"Any category\", value: \"all\" }, { label: \"Camera\", value: \"Camera\" }, { label: \"Tools\", value: \"Tools\" }, { label: \"Electronics\", value: \"Electronics\" }], \"data-market-category\")}\u003c/div>\n            ${field(\"Near\", \"area\", ui.area, \"text\", 'data-market-area placeholder=\"Dallas or Irving\"')}\n            ${marketDateFields()}\n            \u003cbutton class=\"button\" type=\"submit\">Find available items\u003c/button>\n            \u003clabel class=\"field\">Sort results${selectControl(\"sort\", \"Sort results\", ui.sort, [{ label: \"Name\", value: \"name\" }, { label: \"Price: low to high\", value: \"price-low\" }, { label: \"Price: high to low\", value: \"price-high\" }], \"data-market-sort\")}\u003c/label>\n            \u003cp class=\"search-note\" data-filter-status>Find items available for your dates.\u003c/p>\n          \u003c/form>`;\n        }\n\n        function productCard(item) {\n          const photo = item.photos?.[0] ? { img: item.photos[0] } : products[item.photo ?? 0];\n         return `\u003ca class=\"product-card\" href=\"?screen=listing&amp;item=${escapeHtml(item.id)}\" data-demo-action=\"listing\" data-id=\"${escapeHtml(item.id)}\" data-market-item data-category=\"${escapeHtml(item.category)}\" data-area=\"${escapeHtml(item.area)}\">\n            \u003cdiv class=\"product-image\">\u003cimg src=\"${photo.img}\" width=\"760\" height=\"560\" alt=\"${escapeHtml(item.name)}\" loading=\"lazy\">\u003cspan class=\"product-badge\">${item.instant ? \"Instant booking\" : \"Owner approval\"}\u003c/span>\u003c/div>\n            \u003cdiv class=\"product-copy\">\u003cdiv class=\"product-meta\">\u003cspan>${escapeHtml(item.area)} area\u003c/span>\u003cspan>${escapeHtml(item.category)}\u003c/span>\u003c/div>\u003ch3>${escapeHtml(item.name)}\u003c/h3>\n              \u003cp>Local pickup · thoughtfully shared\u003c/p>\u003cdiv class=\"product-bottom\">\u003cspan class=\"price\">${usd(item.price)} \u003csmall>/ day\u003c/small>\u003c/span>\u003cspan>See item →\u003c/span>\u003c/div>\u003c/div>\n          \u003c/a>`;\n        }\n\n        function renderDirectory() {\n         return `\u003csection class=\"welcome-layout\" aria-label=\"Discover and browse YBuy\">\n            \u003cdiv class=\"hero-index\">\u003cdiv class=\"hero-copy\">\u003cspan class=\"mono\">A neighborhood marketplace\u003c/span>\u003ch1 class=\"welcome-title\" tabindex=\"-1\">Good things,\u003cbr>\u003cspan>close to home.\u003c/span>\u003c/h1>\u003cp>Borrow a useful thing from someone nearby. Share what you already own. Start with a need, a place, and the days that work for you.\u003c/p>\u003ca class=\"button\" href=\"?screen=search\" data-screen-link=\"search\">Browse nearby things\u003c/a>\u003c/div>\n              \u003cfigure class=\"hero-photo\">\u003cimg src=\"${products[2].img}\" width=\"760\" height=\"560\" fetchpriority=\"high\" decoding=\"async\" alt=\"Portable projector ready for a neighborhood movie night\">\u003cfigcaption>Make room for a little more together.\u003c/figcaption>\u003c/figure>\u003c/div>\n            ${searchForm()}\n            \u003cdiv class=\"section-heading\">\u003ch2>Useful things, around the corner\u003c/h2>\u003cp data-result-count>Available nearby\u003c/p>\u003c/div>\n            \u003cdiv class=\"product-grid\">${demo.data.listings.filter(item => item.status === \"published\").map(productCard).join(\"\")}\u003c/div>\u003cp class=\"notice\" data-empty-results hidden>No available items match. Try another date, city or category.\u003c/p>\n            \u003csection class=\"neighbor-invite\">\u003cdiv>\u003cp class=\"item-kicker\">Have something in mind?\u003c/p>\u003ch2>Ask the neighborhood.\u003c/h2>\u003cp>Tell nearby owners what you need. A useful thing might be closer than you think.\u003c/p>\u003c/div>\u003ca class=\"button secondary\" href=\"?screen=need-something\" data-screen-link=\"need-something\">Ask for an item\u003c/a>\u003c/section>\n          \u003c/section>`;\n        }\n\n        function renderSearch() {\n         return `${searchForm()}\u003cdiv class=\"section-heading\">\u003ch2>Finds nearby\u003c/h2>\u003cp data-result-count>${demo.data.listings.filter(item => item.status === \"published\").length} items\u003c/p>\u003c/div>\u003cdiv class=\"product-grid\">${demo.data.listings.filter(item => item.status === \"published\").map(productCard).join(\"\")}\u003c/div>\u003cp class=\"notice\" data-empty-results hidden>No available items match. Try another date, city or category.\u003c/p>`;\n        }\n\n        function renderGuidelines() {\n         return `\u003cdiv class=\"split\">\u003csection class=\"panel\">\u003ch2>Before the handoff\u003c/h2>\u003col class=\"step-list\">\u003cli>\u003cdiv>\u003cstrong>Check what is included\u003c/strong>\u003cp>Agree on accessories and review the item's condition together.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cdiv>\u003cstrong>Keep your location private\u003c/strong>\u003cp>Share precise pickup details in your booking conversation.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cdiv>\u003cstrong>Review your dates\u003c/strong>\u003cp>Check the pickup, return and owner approval status before making plans.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cdiv>\u003cstrong>Close the loop\u003c/strong>\u003cp>Record pickup and return, and keep your neighbor informed if plans change.\u003c/p>\u003c/div>\u003c/li>\u003c/ol>\u003c/section>\u003caside class=\"ticket\">\u003cspan class=\"mono small\">GOOD NEIGHBOR GUIDE\u003c/span>\u003ch2>Clear plans.\u003cbr>Happy returns.\u003c/h2>\u003cp>A little care makes sharing easier for everyone.\u003c/p>\u003c/aside>\u003c/div>`;\n        }\n\n        function renderAccess() {\n         return `\u003cdiv class=\"split\">\u003csection class=\"panel\">\u003ch2>Welcome back, ${escapeHtml(demo.data.profile.name.split(\",\")[0])}.\u003c/h2>\u003cp>Your rentals, listings and conversations, all in one place.\u003c/p>\u003cdiv class=\"route-links\">${routeLink(routeById.get(\"renting\"))}${routeLink(routeById.get(\"lending\"))}${routeLink(routeById.get(\"profile\"))}\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>Where would you like to go?\u003c/h2>\u003cdiv class=\"filter-tabs\">\u003cbutton type=\"button\" data-sample-action=\"open-screen\" data-next=\"renting\">My rentals\u003c/button>\u003cbutton type=\"button\" data-sample-action=\"open-screen\" data-next=\"lending\">My lending\u003c/button>\u003cbutton type=\"button\" data-sample-action=\"open-screen\" data-next=\"admin-access\">Team workspace\u003c/button>\u003c/div>\u003c/section>\u003c/div>`;\n        }\n\n        function escapeHtml(value) {\n         return String(value ?? \"\").replace(/[&\u003c>\"']/g, char => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[char]));\n        }\n        function usd(value) { return Number(value).toLocaleString(\"en-US\", { style: \"currency\", currency: \"USD\" }); }\n        function demoButton(label, action, id = \"\", next = \"\", disabled = false) {\n         return `\u003cbutton class=\"button secondary\" type=\"button\" data-demo-action=\"${action}\" data-id=\"${escapeHtml(id)}\" data-next=\"${next}\" ${disabled ? \"disabled\" : \"\"}>${escapeHtml(label)}\u003c/button>`;\n        }\n        function field(label, name, value = \"\", type = \"text\", extra = \"\") {\n         if (type === \"hidden\") return `\u003cinput name=\"${name}\" type=\"hidden\" value=\"${escapeHtml(value)}\" ${extra}>`;\n         if (type === \"datetime\") return `\u003cdiv class=\"field\">\u003cspan>${escapeHtml(label)}\u003c/span>\u003cybuy-date-range mode=\"datetime\" label=\"${escapeHtml(label)}\" value=\"${escapeHtml(value)}\" data-date-time>\u003cinput type=\"hidden\" name=\"${name}\" value=\"${escapeHtml(value)}\" data-date-value>\u003c/ybuy-date-range>\u003c/div>`;\n         return `\u003clabel class=\"field\">${escapeHtml(label)}\u003cybuy-input name=\"${name}\" type=\"${type}\" value=\"${escapeHtml(value)}\" label=\"${escapeHtml(label)}\" ${extra}>\u003c/ybuy-input>\u003c/label>`;\n        }\n        function textareaField(label, name, value = \"\", extra = \"\") { return field(label, name, value, \"textarea\", extra); }\n        function checkboxField(label, name, checked = false, extra = \"\") {\n          return `\u003cybuy-input class=\"custom-check\" type=\"checkbox\" name=\"${name}\" label=\"${escapeHtml(label)}\" value=\"on\" ${checked ? \"checked\" : \"\"} ${extra}>\u003c/ybuy-input>`;\n        }\n        function selectControl(name, label, value, options, extra = \"\") {\n          return `\u003cybuy-select name=\"${name}\" label=\"${escapeHtml(label)}\" value=\"${escapeHtml(value)}\" options=\"${escapeHtml(JSON.stringify(options))}\" ${extra}>\u003c/ybuy-select>`;\n        }\n        function formStart(kind, id = \"\") { return `\u003cform class=\"form-panel\" data-form=\"demo-${kind}\" data-id=\"${escapeHtml(id)}\">`; }\n        function formEnd(label) { return `\u003cbutton class=\"button\" type=\"submit\">${label}\u003c/button>\u003cp class=\"form-status\" role=\"status\" data-form-status>\u003c/p>\u003c/form>`; }\n        function empty(message) { return `\u003cp class=\"notice\">${message}\u003c/p>`; }\n        function dateFields(dates = demo.data.dates, listingId = \"\") {\n         const start = escapeHtml(dates?.start || \"\"), end = escapeHtml(dates?.end || \"\");\n         const listing = listingId ? `data-listing-id=\"${escapeHtml(listingId)}\"` : \"\";\n         return `\u003cdiv class=\"field\">\u003cspan>Pick-up and return\u003c/span>\u003cybuy-date-range data-range-picker ${listing} start=\"${start}\" end=\"${end}\" label=\"Pick-up and return\" pickup-label=\"Pick-up\" return-label=\"Return\">\u003cinput type=\"hidden\" name=\"start\" value=\"${start}\" data-range-start>\u003cinput type=\"hidden\" name=\"end\" value=\"${end}\" data-range-end>\u003c/ybuy-date-range>\u003c/div>`;\n        }\n        function marketDateFields() {\n         const start = escapeHtml(demo.data.dates.start), end = escapeHtml(demo.data.dates.end);\n         return `\u003cdiv class=\"field\">\u003cspan>Pick-up and return\u003c/span>\u003cybuy-date-range data-range-picker data-market-range start=\"${start}\" end=\"${end}\" label=\"Filter by rental dates\" pickup-label=\"Pick-up\" return-label=\"Return\">\u003cinput type=\"hidden\" name=\"start\" value=\"${start}\" data-market-start>\u003cinput type=\"hidden\" name=\"end\" value=\"${end}\" data-market-end>\u003c/ybuy-date-range>\u003c/div>`;\n        }\n        function photoGallery(item) {\n          const options = products.map(photo => ({ label: photo.name, url: photo.img }));\n          const initial = item?.photos?.length ? item.photos : [products[item?.photo || 0]?.img].filter(Boolean);\n          return `\u003cdiv class=\"field\">\u003cspan>Photos\u003c/span>\u003cybuy-photo-gallery name=\"photos\" label=\"Listing photos\" photos=\"${escapeHtml(JSON.stringify(initial))}\" options=\"${escapeHtml(JSON.stringify(options))}\">\u003c/ybuy-photo-gallery>\u003c/div>`;\n        }\n        function breakdown(quote, audience = \"renter\") {\n          const rental = `\u003cdiv>\u003cdt>${quote.days} days × ${usd(quote.price)}\u003c/dt>\u003cdd>${usd(quote.subtotal)}\u003c/dd>\u003c/div>`;\n          const renter = `\u003cdiv>\u003cdt>${audience === \"admin\" ? \"Renter service fee\" : \"Service fee\"}\u003c/dt>\u003cdd>${usd(quote.renterFee)}\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>${audience === \"admin\" ? \"Renter total\" : \"Total\"}\u003c/dt>\u003cdd>${usd(quote.total)}\u003c/dd>\u003c/div>`;\n          const owner = `\u003cdiv>\u003cdt>Owner service fee\u003c/dt>\u003cdd>${usd(quote.ownerFee)}\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Owner earnings\u003c/dt>\u003cdd>${usd(quote.ownerNet)}\u003c/dd>\u003c/div>`;\n          const explanation = audience === \"admin\"\n            ? `Fee allocation: ${quote.feeRule.total}% overall; ${quote.feeRule.renterShare}% renter share.`\n            : audience === \"owner\"\n              ? \"Your service fee is deducted from the rental amount.\"\n              : quote.renterFee ? \"Your service fee is included in the total shown.\" : \"No service fee applies to this booking.\";\n          return `\u003cdl class=\"spec-list\">${rental}${audience === \"owner\" ? \"\" : renter}${audience === \"renter\" ? \"\" : owner}\u003c/dl>\u003cp class=\"small muted\">${explanation}\u003c/p>`;\n        }\n        function bookingPanel(booking, audience = \"renter\") {\n          const owner = audience !== \"renter\";\n          const actions = [];\n          if (owner && booking.status === \"requested\") actions.push(demoButton(\"Approve request\", \"booking\", booking.id, \"confirmed\"), demoButton(\"Decline request\", \"booking\", booking.id, \"declined\"));\n          if (!owner && booking.status === \"confirmed\") actions.push(demoButton(\"Go to pickup\", \"open-booking\", booking.id, \"check-in\"));\n          if (!owner && booking.status === \"active\") actions.push(demoButton(\"Go to return\", \"open-booking\", booking.id, \"check-out\"));\n          if ([\"requested\", \"confirmed\"].includes(booking.status)) actions.push(demoButton(\"Cancel booking\", \"booking\", booking.id, \"cancelled\"));\n         return `\u003carticle class=\"panel\" data-booking-row data-booking-state=\"${booking.status}\">\u003cdiv class=\"panel-head\">\u003ch2>${escapeHtml(booking.name)}\u003c/h2>\u003cspan class=\"stamp\">${booking.status}\u003c/span>\u003c/div>\u003cp>${booking.start} to ${booking.end} · \u003cstrong>${booking.id}\u003c/strong>\u003c/p>${breakdown(booking, audience)}${booking.refund ? `\u003cp>${owner ? \"Renter cancellation credit\" : \"Cancellation credit\"}: ${usd(booking.refund)}.\u003c/p>` : \"\"}\u003cdiv class=\"filter-tabs\">${actions.join(\"\")}${demoButton(\"View booking\", \"open-booking\", booking.id, \"confirmation\")}${demoButton(\"Message neighbor\", \"booking-message\", booking.id)}\u003c/div>\u003c/article>`;\n        }\n        function mockListing() {\n          const data = demo.data, item = data.listings.find(row => row.id === data.selectedItem);\n          if (!item) return empty(\"That listing no longer exists. Browse another item.\");\n          const photo = item.photos?.[0] ? { img: item.photos[0] } : products[item.photo ?? 0];\n         return `\u003cdiv class=\"split\">\u003cfigure class=\"photo-stage\">\u003cimg src=\"${photo.img}\" width=\"760\" height=\"560\" fetchpriority=\"high\" decoding=\"async\" alt=\"${escapeHtml(item.name)}\">\u003cfigcaption>Ready for your next project\u003c/figcaption>\u003c/figure>\u003csection class=\"panel\">\u003cp class=\"item-kicker\">${escapeHtml(item.category)} · ${escapeHtml(item.area)}\u003c/p>\u003ch2>${escapeHtml(item.name)}\u003c/h2>\u003cp>${escapeHtml(item.description)}\u003c/p>\u003cdiv class=\"ticket-total\">\u003cstrong>${usd(item.price)}\u003c/strong>\u003cspan>PER DAY\u003c/span>\u003c/div>\u003cp>${item.instant ? \"Instant confirmation\" : \"Owner approval required\"} · ${escapeHtml(item.status)}\u003c/p>${demoButton(data.favorites.includes(item.id) ? \"Remove from saved\" : \"Save item\", \"favorite\", item.id)}${formStart(\"check\", item.id)}\u003ch2>Find your dates\u003c/h2>${dateFields(demo.data.dates, item.id)}\u003cp class=\"small\">One item available. Return dates are exclusive; a return and pickup may share a date.\u003c/p>${formEnd(\"Check availability\")}\u003cdiv data-availability-result aria-live=\"polite\">\u003c/div>\u003cdetails>\u003csummary>See calendar blocks\u003c/summary>\u003cp>${item.blocked.map(range => `${range.start} to ${range.end}`).join(\"; \") || \"No owner blocks.\"}\u003c/p>\u003cp>Saved requested, confirmed and active bookings also block inventory.\u003c/p>\u003c/details>\u003c/section>\u003c/div>`;\n        }\n        function mockRenting(route) {\n          const data = demo.data, booking = data.bookings.find(item => item.id === data.selectedBooking);\n          if (route.id === \"checkout\") {\n            const item = data.listings.find(row => row.id === data.selectedItem);\n            if (!item) return empty(\"Choose a listing first.\");\n            const quote = demo.quote(item.id, data.dates.start, data.dates.end);\n            const available = demo.available(item.id, data.dates.start, data.dates.end);\n           return `\u003cdiv class=\"split\">${formStart(\"book\", item.id)}\u003ch2>Review your booking\u003c/h2>\u003cp>${escapeHtml(item.name)}\u003c/p>${dateFields(demo.data.dates, item.id)}${checkboxField(\"I have reviewed the dates and rental total.\", \"ack\", false, \"required\")}\u003cp class=\"notice\">${available ? \"Available in the calendar.\" : \"These dates are no longer available. Change them or browse another item.\"}\u003c/p>${formEnd(item.instant ? \"Confirm booking\" : \"Request booking\")}\u003caside class=\"ticket\">\u003ch2>Your price breakdown\u003c/h2>\u003cdiv data-live-quote>${breakdown(quote)}\u003c/div>\u003c/aside>\u003c/div>`;\n          }\n          if (route.id === \"confirmation\") return booking ? `\u003cp class=\"notice\">\u003cstrong>${booking.status === \"requested\" ? \"Request sent to the owner.\" : booking.status === \"confirmed\" ? \"Your booking is confirmed.\" : \"Your booking is up to date.\"}\u003c/strong> Follow your booking below for the next step.\u003c/p>${bookingPanel(booking)}\u003cdiv class=\"filter-tabs\">${demoButton(\"Open owner workspace\", \"route\", \"\", \"lending\")}${demoButton(\"My rentals\", \"route\", \"\", \"renting\")}\u003c/div>` : empty(\"Find something you need and choose your dates to get started.\");\n          if ([\"check-in\", \"check-out\"].includes(route.id)) {\n            if (!booking) return empty(\"Choose a booking from your rentals.\");\n            const pickup = route.id === \"check-in\", eligible = booking.status === (pickup ? \"confirmed\" : \"active\");\n           return `${bookingPanel(booking)}${eligible ? `${formStart(\"handoff\", booking.id)}\u003ch2>${pickup ? \"Pickup\" : \"Return\"} checklist\u003c/h2>\u003cp>Check the item and accessories together before completing the handoff.\u003c/p>${checkboxField(\"I checked the item condition and included accessories.\", \"condition\", false, \"required\")}${checkboxField(\"We both acknowledge the handoff.\", \"ack\", false, \"required\")}\u003cinput type=\"hidden\" name=\"next\" value=\"${pickup ? \"active\" : \"completed\"}\">${formEnd(pickup ? \"Record pickup\" : \"Complete return\")}` : empty(`This booking is ${booking.status}. ${pickup ? \"Approve it in Lending before pickup.\" : \"Record pickup before return.\"}`)}`;\n          }\n          if (route.id === \"favorites\") return data.favorites.length ? `\u003csection aria-labelledby=\"saved-items-heading\">\u003ch2 id=\"saved-items-heading\">Saved items\u003c/h2>\u003cdiv class=\"product-grid\">${data.listings.filter(item => data.favorites.includes(item.id)).map(productCard).join(\"\")}\u003c/div>\u003c/section>` : empty(\"No saved items. Open an item and choose Save item.\");\n          if (route.id === \"notifications\") return `\u003csection class=\"panel\">\u003ch2>Recent activity\u003c/h2>${data.notifications.length ? data.notifications.map(notice => `\u003carticle class=\"route-link\">\u003cspan>${escapeHtml(notice.text)}\u003c/span>${notice.read ? \"\u003cstrong>Read\u003c/strong>\" : demoButton(\"Mark read\", \"read\", notice.id)}\u003c/article>`).join(\"\") : empty(\"You're all caught up.\")}\u003c/section>`;\n          if (route.id === \"profile\") return `${formStart(\"profile\")}\u003ch2>Your profile\u003c/h2>\u003cp>Choose how your name and neighborhood appear to other members.\u003c/p>${field(\"Display name\", \"name\", data.profile.name, \"text\", 'required maxlength=\"80\"')}${field(\"Approximate area\", \"area\", data.profile.area, \"text\", 'required maxlength=\"100\"')}${formEnd(\"Save profile\")}`;\n          if (route.id === \"wallet\") return `\u003csection class=\"panel\">\u003ch2>Costs and credits\u003c/h2>\u003cp>See what your bookings add up to and any credits from cancellations.\u003c/p>\u003cdl class=\"spec-list\">\u003cdiv>\u003cdt>Booking totals\u003c/dt>\u003cdd>${usd(data.bookings.filter(item => ![\"declined\", \"cancelled\"].includes(item.status)).reduce((sum, item) => sum + item.total, 0))}\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cancellation credits\u003c/dt>\u003cdd>${usd(data.bookings.reduce((sum, item) => sum + item.refund, 0))}\u003c/dd>\u003c/div>\u003c/dl>${data.bookings.map(item => `\u003cp>${item.id} · ${item.status} · ${usd(item.total)}\u003c/p>`).join(\"\")}\u003c/section>`;\n         return `\u003cdiv class=\"filter-tabs\" role=\"group\" aria-label=\"Filter rentals\">${[\"all\", \"requested\", \"confirmed\", \"active\", \"completed\", \"cancelled\"].map(filter => `\u003cbutton type=\"button\" data-demo-action=\"filter\" data-id=\"${filter}\" aria-pressed=\"${ui.filter === filter}\">${filter}\u003c/button>`).join(\"\")}\u003c/div>${data.bookings.filter(item => ui.filter === \"all\" || item.status === ui.filter).map(item => bookingPanel(item)).join(\"\") || empty(\"No rentals in this state. Browse items to start a booking.\")}`;\n        }\n        function mockLending(route) {\n          const data = demo.data;\n          if (route.id === \"payouts\") {\n            const rows = data.bookings.filter(item => item.status === \"completed\");\n           return `\u003csection class=\"panel\">\u003ch2>Completed-rental earnings\u003c/h2>\u003cdiv class=\"ticket-total\">\u003cstrong>${usd(rows.reduce((sum, item) => sum + item.ownerNet, 0))}\u003c/strong>\u003cspan>COMPLETED RENTALS\u003c/span>\u003c/div>${rows.map(item => `\u003carticle>\u003ch3>${escapeHtml(item.name)} · ${item.id}\u003c/h3>${breakdown(item, \"owner\")}\u003c/article>`).join(\"\") || empty(\"Complete a pickup and return to see earnings here.\")}\u003c/section>`;\n          }\n          if (route.id === \"owner-listings\") return `\u003cdiv class=\"filter-tabs\">${demoButton(\"Add a listing\", \"route\", \"\", \"create-listing\")}\u003c/div>${data.listings.map(item => `\u003carticle class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>${escapeHtml(item.name)}\u003c/h2>\u003cspan class=\"stamp\">${item.status}\u003c/span>\u003c/div>\u003cp>${usd(item.price)}/day · estimated value ${usd(item.value)} · ${escapeHtml(item.area)}\u003c/p>\u003cdiv class=\"filter-tabs\">${demoButton(\"Edit item & availability\", \"edit\", item.id)}${demoButton(\"View listing\", \"listing\", item.id)}\u003c/div>\u003c/article>`).join(\"\")}`;\n          if ([\"create-listing\", \"edit-listing\"].includes(route.id)) {\n            const edit = route.id === \"edit-listing\", item = edit ? data.listings.find(row => row.id === data.selectedItem) : null;\n            if (edit && !item) return empty(\"Choose an item from My listings.\");\n           return `${formStart(\"listing\", item?.id || \"\")}\u003ch2>${edit ? \"Edit your listing\" : \"Share a useful thing\"}\u003c/h2>\u003cp>Describe your item clearly so neighbors know what is included.\u003c/p>${field(\"Item name\", \"name\", item?.name || \"\", \"text\", 'required minlength=\"3\" maxlength=\"120\"')}\u003clabel class=\"field\">Category${selectControl(\"category\", \"Category\", item?.category || \"Tools\", [\"Tools\", \"Camera\", \"Electronics\", \"Outdoor\"].map(category => ({ label: category, value: category })), \"required\")}\u003c/label>${photoGallery(item)}${textareaField(\"Description\", \"description\", item?.description || \"\", 'minlength=\"10\" maxlength=\"2000\" required')}\u003cdiv class=\"field-grid\">${field(\"Daily price (USD)\", \"price\", item?.price || \"\", \"number\", 'required min=\"1\" max=\"5000\" step=\".01\"')}${field(\"Estimated value (USD)\", \"value\", item?.value ?? \"\", \"number\", `required min=\"0\" max=\"${data.policy.maximum}\" step=\".01\"`)}\u003c/div>${field(\"Approximate city\", \"area\", item?.area || \"\", \"text\", 'required minlength=\"2\" maxlength=\"200\"')}${checkboxField(\"Instant booking (otherwise owner approval)\", \"instant\", item?.instant || false)}\u003cp class=\"notice\">Above ${usd(data.policy.threshold)} needs admin review; above ${usd(data.policy.maximum)} is rejected.\u003c/p>${formEnd(\"Save listing\")}${item ? `\u003csection class=\"panel\">\u003ch2>Owner availability\u003c/h2>${item.blocked.map((range, index) => `\u003cp>${range.start} to ${range.end} ${demoButton(\"Reopen dates\", \"unblock\", item.id, String(index))}\u003c/p>`).join(\"\") || empty(\"No owner-blocked dates.\")}${formStart(\"block\", item.id)}${dateFields(demo.data.dates, item.id)}${formEnd(\"Block dates\")}\u003c/section>` : \"\"}`;\n          }\n         return `\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>Requests from your neighbors\u003c/h2>${demoButton(\"Manage listings\", \"route\", \"\", \"owner-listings\")}\u003c/div>\u003cp>Review incoming requests and confirm a handoff that works for you.\u003c/p>\u003c/section>${data.bookings.map(item => bookingPanel(item, \"owner\")).join(\"\") || empty(\"No requests yet. Make a booking as a renter.\")}`;\n        }\n        function requestFields() {\n         return `${field(\"Item name\", \"title\", \"\", \"text\", 'required minlength=\"3\" maxlength=\"120\"')}\u003clabel class=\"field\">Category${selectControl(\"category\", \"Category\", \"Electronics\", [\"Electronics\", \"Tools\", \"Camera\", \"Outdoor\"].map(category => ({ label: category, value: category })))}\u003c/label>${textareaField(\"Description\", \"description\", \"\", 'minlength=\"10\" maxlength=\"1200\" required')}${dateFields()}${field(\"Approximate city\", \"area\", \"Dallas\", \"text\", 'required minlength=\"2\" maxlength=\"200\"')}\u003cdiv class=\"field-grid\">${field(\"Daily budget (USD, optional)\", \"budget\", \"\", \"number\", 'min=\".01\" step=\".01\"')}${field(\"Quantity\", \"quantity\", \"1\", \"number\", 'required min=\"1\" max=\"100\" step=\"1\"')}\u003c/div>${field(\"Intended use (optional)\", \"use\", \"\", \"text\", 'maxlength=\"500\"')}${field(\"Accessories or specifications (optional)\", \"specs\", \"\", \"text\", 'maxlength=\"500\"')}${textareaField(\"Notes (optional)\", \"notes\", \"\", 'maxlength=\"1200\"')}${checkboxField(\"Notify me when an owner links a matching item\", \"notify\", true)}`;\n        }\n        function mockCommunity(route) {\n          const data = demo.data;\n          if (route.id === \"need-something\") return `${formStart(\"request\")}\u003ch2>What are you looking for?\u003c/h2>\u003cp>Include the dates, budget and details that matter.\u003c/p>${requestFields()}${demoButton(\"Review matching items\", \"review-matches\")}\u003cdiv data-request-matches aria-live=\"polite\">\u003c/div>${checkboxField(\"Share this request with nearby owners.\", \"ack\", false, \"required\")}${formEnd(\"Post request\")}`;\n          if ([\"requests\", \"my-requests\", \"offers\"].includes(route.id)) {\n            const rows = data.requests.filter(item => route.id === \"requests\" || item.mine);\n           return `\u003csection class=\"panel\">\u003ch2>${route.id === \"requests\" ? \"Find an item someone needs\" : \"Your requests\"}\u003c/h2>${route.id === \"offers\" ? \"\u003cp>Keep track of your requests and responses from nearby owners.\u003c/p>\" : \"\"}${demoButton(\"Post a request\", \"route\", \"\", \"need-something\")}\u003c/section>${rows.map(item => `\u003carticle class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>${escapeHtml(item.title)}\u003c/h2>\u003cspan class=\"stamp\">${item.status}\u003c/span>\u003c/div>\u003cp>${escapeHtml(item.area)} · ${item.start} to ${item.end} · ${item.quantity} requested\u003c/p>\u003cp>${escapeHtml(item.description)}\u003c/p>\u003cdiv class=\"filter-tabs\">${demoButton(\"See matches & owner responses\", \"matches\", item.id)}${item.status === \"open\" ? demoButton(\"Close request\", \"close-request\", item.id) : \"\"}\u003c/div>\u003c/article>`).join(\"\") || empty(\"No requests. Post your first one.\")}`;\n          }\n          if (route.id === \"matches\") {\n            const request = data.requests.find(item => item.id === data.selectedRequest);\n            if (!request) return empty(\"Choose a request first.\");\n            let matches;\n            try { matches = demo.matches(request); } catch (error) { return empty(`Cannot match this request: ${escapeHtml(error.message)}`); }\n           return `\u003csection class=\"panel\">\u003ch2>Matches for ${escapeHtml(request.title)}\u003c/h2>\u003cp>Category, approximate city, budget, quantity and calendar are checked. ${request.status === \"closed\" ? \"This request is closed; owner linking is disabled.\" : \"\"}\u003c/p>\u003c/section>\u003cdiv class=\"product-grid\">${matches.map(productCard).join(\"\")}\u003c/div>${matches.map(item => `\u003cp>${escapeHtml(item.name)} ${request.linked.includes(item.id) ? \"\u003cstrong>Linked by owner\u003c/strong>\" : demoButton(\"Link as owner\", \"link-request\", request.id, item.id, request.status !== \"open\")}\u003c/p>`).join(\"\") || empty(\"No items match these dates, quantity, area and budget. Try broadening your request.\")}`;\n          }\n          if ([\"messages\", \"conversation\"].includes(route.id)) return `\u003cdiv class=\"message-layout\">\u003caside class=\"conversation-list\">\u003ch2>Your inbox\u003c/h2>${[...new Set([\"neighbors\", ...data.messages.map(item => item.conversation)])].map(id => demoButton(id === \"neighbors\" ? \"Neighborhood conversation\" : id, \"conversation\", id)).join(\"\")}\u003c/aside>\u003csection class=\"message-thread\">\u003ch2>${escapeHtml(data.conversation)}\u003c/h2>\u003cdiv class=\"message-log\" aria-live=\"polite\">${data.messages.filter(item => item.conversation === data.conversation).map(item => `\u003cp class=\"message ${item.from === \"you\" ? \"from-me\" : \"\"}\">\u003cstrong>${item.from === \"you\" ? \"You\" : \"Jordan\"}:\u003c/strong> ${escapeHtml(item.text)}\u003c/p>`).join(\"\") || empty(\"Start a conversation.\")}\u003c/div>${formStart(\"message\")}${textareaField(\"Message\", \"text\", \"\", 'required maxlength=\"500\"')}${formEnd(\"Send message\")}${demoButton(\"Conversation tips\", \"reply\")}\u003c/section>\u003c/div>`;\n          if ([\"claims\", \"support\"].includes(route.id)) {\n            const kind = route.id === \"claims\" ? \"claim\" : \"support\", rows = data.cases.filter(item => item.kind === kind);\n           return `${formStart(\"case\")}\u003ch2>Open a  ${kind}\u003c/h2>\u003cinput name=\"kind\" type=\"hidden\" value=\"${kind}\">${field(\"Topic\", \"title\", \"\", \"text\", 'required minlength=\"3\" maxlength=\"120\"')}${formEnd(\"Open case\")}${rows.map(item => `\u003carticle class=\"panel\">\u003ch2>${escapeHtml(item.title)}\u003c/h2>\u003cp>${item.id} · ${item.status}\u003c/p>${demoButton(\"View case\", \"case\", item.id, kind === \"claim\" ? \"claim-detail\" : \"support-detail\")}\u003c/article>`).join(\"\") || empty(\"No cases yet.\")}`;\n          }\n          const record = data.cases.find(item => item.id === data.selectedCase && item.kind === (route.id === \"claim-detail\" ? \"claim\" : \"support\"));\n         return record ? `\u003csection class=\"panel\">\u003ch2>${escapeHtml(record.title)}\u003c/h2>\u003cp>${record.id} · ${record.status}\u003c/p>${record.replies.filter(reply => !reply.internal).map(reply => `\u003cp class=\"message\">${escapeHtml(reply.text)}\u003c/p>`).join(\"\") || empty(\"No public replies yet.\")}\u003c/section>${formStart(\"case-reply\", record.id)}${textareaField(\"Reply\", \"text\", \"\", 'required maxlength=\"500\"')}${formEnd(\"Send reply\")}` : empty(\"No case selected for this area. Open or create one from the case list.\");\n        }\n        function mockBidding(route) {\n          const data = demo.data, closed = Date.now() >= data.auctionClose;\n          if (route.id === \"bidding\") return `\u003csection class=\"panel\">\u003ch2>Cordless drill kit\u003c/h2>\u003cp>Owner selects eligible bids before ${escapeHtml(new Date(data.auctionClose).toLocaleString())}. Owner selection required.\u003c/p>\u003cdiv class=\"filter-tabs\">${demoButton(\"Place a bid\", \"route\", \"\", \"bid-detail\")}${demoButton(\"My bids\", \"route\", \"\", \"my-bids\")}${demoButton(\"Owner selections\", \"route\", \"\", \"auction\")}\u003c/div>\u003c/section>`;\n          if (route.id === \"bid-detail\") return `${formStart(\"bid\")}\u003ch2>Cordless drill auction\u003c/h2>\u003cp>${closed ? \"Auction closed. No more bids or owner selections.\" : \"Bidding is open. The owner chooses before close.\"}\u003c/p>${dateFields({ start: demo.date(17), end: demo.date(19) }, \"drill\")}${field(\"Daily bid (USD)\", \"amount\", Math.max(25, ...data.bids.map(item => item.amount)) + 1, \"number\", 'required min=\"1\" max=\"5000\" step=\".01\"')}${formEnd(\"Place bid\")}`;\n          const rows = data.bids.filter(item => route.id !== \"my-bids\" || item.mine);\n         return `\u003csection class=\"panel\">\u003ch2>${route.id === \"auction\" ? \"Owner bid selection\" : \"Your bids\"}\u003c/h2>\u003cp>${closed ? \"Selection deadline passed. Unselected bids have no winner.\" : \"Select eligible, non-overlapping periods before close. Each selection confirms the dates for that renter.\"}\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"manifest\">\u003cthead>\u003ctr>\u003cth>Bid\u003c/th>\u003cth>Dates\u003c/th>\u003cth>Daily rate\u003c/th>\u003cth>Rental value\u003c/th>\u003cth>State\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(bid => `\u003ctr>\u003ctd>${bid.id}${bid.mine ? \" · yours\" : \"\"}\u003c/td>\u003ctd>${bid.start} to ${bid.end}\u003c/td>\u003ctd>${usd(bid.amount)}\u003c/td>\u003ctd>${usd((Date.parse(bid.end) - Date.parse(bid.start)) / 86400000 * bid.amount)}\u003c/td>\u003ctd>${bid.status}\u003c/td>\u003ctd>${bid.bookingId ? demoButton(\"Open booking\", \"open-booking\", bid.bookingId, \"confirmation\") : route.id === \"auction\" ? demoButton(\"Select eligible bid\", \"award\", bid.id, \"\", closed) : \"Awaiting owner\"}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>${rows.length ? \"\" : empty(\"No bids placed by you. Open an auction to start.\")}${demoButton(\"Place another bid\", \"route\", \"\", \"bid-detail\")}\u003c/section>`;\n        }\n        function mockAdmin(route) {\n          const data = demo.data;\n          if (route.id === \"admin-access\") return `\u003cdiv class=\"split\">\u003csection class=\"panel\">\u003ch2>Team workspace\u003c/h2>\u003cp>Select u003c/h3>${data.fees.map(rule => `\u003cp>${rule.total}% · renter ${rule.renterShare}% / owner ${100 - rule.renterShare}% · ${rule.effective ? escapeHtml(new Date(rule.effective).toLocaleString()) : \"Initial rule\"} · ${escapeHtml(rule.reason)}\u003c/p>`).join(\"\")}\u003c/section>\u003csection class=\"panel\">\u003ch2>Listing value controls\u003c/h2>${formStart(\"policy\")}\u003cdiv class=\"field-grid\">${field(\"Review threshold (USD)\", \"threshold\", data.policy.threshold, \"number\", 'required min=\"0\" step=\".01\"')}${field(\"Maximum estimated value (USD)\", \"maximum\", data.policy.maximum, \"number\", 'required min=\".01\" step=\".01\"')}\u003c/div>${field(\"Reason\", \"reason\", \"\", \"text\", 'required maxlength=\"500\"')}${formEnd(\"Save listing limits\")}\u003cp class=\"notice\">Current defaults: $1,000 review / $5,000 maximum.\u003c/p>\u003c/section>`;\n          }\n          if (route.id === \"admin-overview\" || route.id === \"admin-analytics\") return `\u003csection class=\"panel\">\u003ch2>Marketplace overview\u003c/h2>\u003cdiv class=\"metric-strip\">\u003cdiv class=\"metric\">\u003cspan>Listings\u003c/span>\u003cstrong>${data.listings.length}\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Bookings\u003c/span>\u003cstrong>${data.bookings.length}\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Awaiting owner\u003c/span>\u003cstrong>${data.bookings.filter(item => item.status === \"requested\").length}\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Completed earnings\u003c/span>\u003cstrong>${usd(data.bookings.filter(item => item.status === \"completed\").reduce((sum, item) => sum + item.ownerNet, 0))}\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"route-links\">${[\"admin-listings\", \"admin-bookings\", \"admin-support\", \"admin-settings\"].map(id => routeLink(routeById.get(id))).join(\"\")}\u003c/div>\u003ch3>Recent activity\u003c/h3>${data.audit.slice(-12).reverse().map(item => `\u003cp>${escape \"Send reply\")}${demoButton(\"Resolve case\", \"resolve\", item.id)}\u003c/section>`).join(\"\") || empty(\"No cases. Create a case from Claims or Support.\");\n          if ([\"admin-payments\", \"admin-payouts\", \"admin-refunds\"].includes(route.id)) {\n            const refunds = route.id === \"admin-refunds\", payouts = route.id === \"admin-payouts\";\n            const rows = data.bookings.filter(item => refunds ? item.refund > 0 : payouts ? item.status === \"completed\" : true);\n           return `\u003csection class=\"panel\">\u003ch2>${payouts ? \"Owner earnings\" : refunds ? \"Cancellation credits\" : \"Booking ledger\"}\u003c/h2>\u003cp>Review amounts and open a booking for its full history.\u003c/p>${rows.map(item => `\u003carticle class=\"route-link\">\u003cspan>${item.id} · ${item.status}\u003c/span>\u003cstrong>${usd(refunds ? item.refund : payouts ? item.ownerNet : item.total)}\u003c/strong>${demoButton(\"Inspect booking\", \"open-booking\", item.id, \"confirmation\")}\u003c/article>`).join(\"\") || empty(\"No matching ledger entries.\")}\u003c/section>`;\n          }\n          const kind = route.id.replace(\"admin-\", \"\"), records = data.records[kind];\n          if (!records) return empty(\"This module is unavailable in the workspace.\");\n          const alternate = { users: { active: \"restricted\", restricted: \"active\" }, investigations: { open: \"reviewed\", reviewed: \"open\" }, reviews: { visible: \"hidden\", hidden: \"visible\" }, promotions: { active: \"paused\", paused: \"active\" }, categories: { visible: \"hidden\", hidden: \"visible\" } };\n         return `\u003csection class=\"panel\">\u003ch2>${escapeHtml(adminLabels[route.id])}\u003c/h2>${records.map(record => `\u003carticle class=\"route-link\">\u003cspan>${escapeHtml(record.name)} · \u003cstrong>${record.status}\u003c/strong>\u003c/span>\u003cbutton class=\"button secondary\" type=\"button\" data-demo-action=\"record\" data-kind=\"${kind}\" data-id=\"${record.id}\" data-nex   :root {

  body { font-size: 16px !important; line-height: 1.5 !important; }

  .view-body { gap: 1.25rem !important; }
  .panel, .form-panel, .ticket { border: 1px solid #e9e4e1 !important; border-radius: 16px !important; box-shadow: 0 2px 6px rgb(41 37 36 / 4%) !important; padding: 1.35rem !important; }
  .panel h2, .panel h3, .form-panel h2, .ticket h2 { font-family: "DM Sans", Arial, sans-serif !important; font-size: 1.35rem !important; line-height: 1.3 !important; letter-spacing: -.02em !important; font-weight: 650 !important; text-transform: none !important; }
  .button { min-height: 44px !important; padding: .65rem 1rem !important; background: #b64a36 !important; border: 1px solid #b64a36 !important; border-radius: 999px !important; font: 600 .9rem/1.2 "DM Sans", Arial, sans-serif !important; transition: background-color 160ms ease, transform 160ms ease !important; }
