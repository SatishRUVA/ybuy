name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      skip_app:
        type: boolean
        default: false
      skip_database:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App checks
    if: ${{ !inputs.skip_app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-not-a-valid-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Build customer bundle and manifest
        env:
          VITE_SITE_VARIANT: main
        run: pnpm run build --outDir dist-customer --manifest
      - name: Build administrator bundle and manifest
        env:
          VITE_SITE_VARIANT: admin
        run: pnpm run build --outDir dist-admin --manifest
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test tests/*.test.mjs
      - name: Test bidding, pricing, insurance, and scheduling
        run: >-
          pnpm exec playwright test
          tests/date-bidding.spec.ts
          tests/checkout-pricing.spec.ts
          tests/checkout-insurance.spec.ts
          tests/handoff-hours.spec.ts
          tests/booking-handoff.spec.ts
          --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  database:
    name: Database checks
    if: ${{ !inputs.skip_database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable Supabase
        id: start_supabase
        run: pnpm exec supabase start -x studio,logflare,vector,edge-runtime
      - name: Replay migrations without development seed data
        run: pnpm exec supabase db reset --local --no-seed
      - name: Run pgTAP tests
        run: pnpm exec supabase test db
      - name: Stop disposable Supabase
        if: always() && steps.start_supabase.outcome != 'skipped'
        run: pnpm exec supabase stop --no-backup
