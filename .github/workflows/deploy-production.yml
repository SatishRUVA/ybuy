name: Deploy dev to production

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'api/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'postcss.config.*'
      - 'tailwind.config.*'
      - 'tsconfig*.json'
      - 'scripts/check-netlify-env.mjs'
      - 'supabase/**'

permissions:
  contents: read

concurrency:
  group: dev-production-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          frontend=false
          backend=false
          while IFS= read -r path; do
            case "$path" in
              src/*|public/*|api/*|netlify/*|netlify.toml|index.html|package.json|pnpm-lock.yaml|vite.config.*|postcss.config.*|tailwind.config.*|tsconfig*.json|scripts/check-netlify-env.mjs)
                frontend=true
                ;;
            esac
            case "$path" in
              supabase/*) backend=true ;;
            esac
          done <<< "$changed_files"

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  checks:
    name: Validate changed layers
    needs: detect-changes
    uses: ./.github/workflows/ci.yml
    with:
      skip_app: ${{ needs.detect-changes.outputs.frontend != 'true' }}
      skip_database: ${{ needs.detect-changes.outputs.backend != 'true' }}

  deploy-backend:
    name: Deploy Supabase backend
    if: needs.detect-changes.outputs.backend == 'true'
    needs: [detect-changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ybuys.netlify.app
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production Supabase target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done
          if [ "$SUPABASE_PROJECT_REF" != "jzyjmsixfuwzfnntewqn" ]; then
            echo "::error::Refusing to deploy to an unapproved Supabase project."
            exit 1
          fi
      - name: Link production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Check pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --dry-run
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --yes
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

  deploy-frontend:
    name: Deploy Netlify frontend
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.checks.result == 'success' &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    needs: [detect-changes, checks, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ybuys.netlify.app
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VITE_SITE_VARIANT: combined
      VITE_TEST_ENVIRONMENT: 'true'
      VITE_TEST_PROFILE_LOGIN: 'true'
      VITE_TEST_PROFILE_HOSTS: ybuys.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Netlify CLI
        run: npm install --global --registry=https://registry.npmjs.org netlify-cli@27.14.3
      - name: Validate Netlify and backend targets
        shell: bash
        run: |
          set -euo pipefail
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done
          if [ "$SUPABASE_PROJECT_REF" != "jzyjmsixfuwzfnntewqn" ]; then
            echo "::error::Refusing to build the site for an unapproved Supabase project."
            exit 1
          fi
          supabase_url="$(netlify env:get VITE_SUPABASE_URL --context production --scope builds --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN")"
          if [ "$supabase_url" != "https://${SUPABASE_PROJECT_REF}.supabase.co" ]; then
            echo "::error::Netlify VITE_SUPABASE_URL does not match the approved Supabase project."
            exit 1
          fi
      - name: Build and publish Netlify production site
        run: netlify deploy --remote --prod --context production --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
      - name: Check deployed homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 \
            https://ybuys.netlify.app/ --output "$RUNNER_TEMP/ybuy-netlify-homepage.html"
          grep -q '<div id="root">' "$RUNNER_TEMP/ybuy-netlify-homepage.html"
