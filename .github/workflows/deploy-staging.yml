name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy backend then frontend
    if: github.ref == 'refs/heads/staging'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://ybuy-e2e-test.vercel.app
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate staging configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing staging configuration: $name"
              exit 1
            fi
          done
          if [ "$SUPABASE_PROJECT_REF" != "jzyjmsixfuwzfnntewqn" ]; then
            echo "::error::Refusing to deploy to a different Supabase project."
            exit 1
          fi
      - name: Pull Vercel test project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Verify the Vercel target and backend
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const project = JSON.parse(readFileSync('.vercel/project.json', 'utf8'));
          if (project.projectId !== 'prj_EPA4yabSGHQi3UuMwotrW8oTPFVL') {
            throw new Error('Refusing to deploy to a different Vercel project.');
          }
          const env = readFileSync('.vercel/.env.production.local', 'utf8');
          const url = env.match(/^VITE_SUPABASE_URL=(.*)$/m)?.[1]?.trim().replace(/^["']|["']$/g, '');
          if (url !== `https://${process.env.SUPABASE_PROJECT_REF}.supabase.co`) {
            throw new Error('Vercel VITE_SUPABASE_URL must point to the staging Supabase project.');
          }
          JS
      - name: Build frontend before changing the backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel build --prod --token="$VERCEL_TOKEN"
      - name: Link staging database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Check pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --dry-run
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --yes
      - name: Deploy Edge Functions with project JWT settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Publish frontend to the Vercel test project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
      - name: Check deployed homepage
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 \
            https://ybuy-e2e-test.vercel.app/ --output "$RUNNER_TEMP/ybuy-homepage.html"
          grep -q '<div id="root">' "$RUNNER_TEMP/ybuy-homepage.html"
